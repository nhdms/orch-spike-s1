name: plan
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  checks: write
jobs:
  plan:
    runs-on: [self-hosted, linux, server-b]
    steps:
      - uses: actions/checkout@v4
      - name: claude plan
        run: |
          PLAN=$(claude -p "Output ONLY the word: PLAN_READY")
          echo "result: $PLAN"
          test "$PLAN" = "PLAN_READY"
      - name: post check
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh api repos/${{ github.repository }}/check-runs \
            -X POST -F name=plan-uploaded \
            -F head_sha=${{ github.event.pull_request.head.sha }} \
            -F status=completed -F conclusion=success
